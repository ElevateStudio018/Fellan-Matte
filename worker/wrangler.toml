name = "fellan-matte-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Webbadressen där appen ligger (för CORS). "*" tillåter alla.
ALLOWED_ORIGIN = "https://elevatestudio018.github.io"
# Kommaseparerade klasskoder som får använda AI:n. Tomt = alla.
CLASS_CODES = ""

# Hemligheter (sätts med `npx wrangler secret put NAMN`):
#   ANTHROPIC_API_KEY  – din nyckel från console.anthropic.com
#   TEACHER_PIN        – krävs för att läsa in boksidor (/extract)
