<title>Designquizet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Archivo:wght@400;600;700&family=Manrope:wght@400;600;800&family=Montserrat:wght@400;600;700&family=Source+Sans+3:wght@400;600&family=Figtree:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: sticky toppfält med delar och framsteg, en fråga i taget med alternativ i rutnät eller staplade. */
:root {
  --bg: #ffffff;
  --surface: #f5f5f3;
  --ink: #141413;
  --ink-2: #5b5b57;
  --line: #e4e3df;
  --sel: #1e6e37;
  --sel-bg: #e6f2e9;
  --focus: #1e6e37;
  --font: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121211; --surface: #1c1c1a; --ink: #f2f2ef; --ink-2: #a8a8a2; --line: #2e2e2b; --sel: #5cc47d; --sel-bg: #16301e; --focus: #5cc47d; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121211; --surface: #1c1c1a; --ink: #f2f2ef; --ink-2: #a8a8a2; --line: #2e2e2b; --sel: #5cc47d; --sel-bg: #16301e; --focus: #5cc47d; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

.qz-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.qz-top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.brand { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.parts { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 12px; flex-wrap: wrap; }
.parts button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
.parts button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.parts button span { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 500; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--bg); padding: 8px 14px; border-radius: var(--r); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.progress { height: 4px; background: var(--surface); }
.progress div { height: 100%; background: var(--sel); width: 0; transition: width .25s; }
.save { font-size: 13px; color: var(--ink-2); padding-block: 0 8px; }

main { padding-block: 28px 80px; }
.qhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 6px; color: var(--ink-2); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.qtext { font-size: clamp(24px, 3.2vw, 34px); font-weight: 800; letter-spacing: -0.015em; line-height: 1.15; margin: 0 0 22px; text-wrap: balance; }
.qz-opts { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.qz-opts.stack { grid-template-columns: 1fr; }
.qz-opts.n4:not(.stack) { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.qz-opt { display: flex; flex-direction: column; text-align: left; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); padding: 0; cursor: pointer; min-width: 0; transition: border-color .12s; }
.qz-opt:hover { border-color: var(--ink-2); }
.qz-opt[aria-pressed="true"] { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel); }
.qz-opt .qz-render { flex: 1; min-height: 120px; display: flex; flex-direction: column; justify-content: center; pointer-events: none; }
.qz-opt .qz-render > .spec { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.qz-opt .qz-lab { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); font-weight: 600; font-size: 15px; }
.qz-opt[aria-pressed="true"] .qz-lab { background: var(--sel-bg); }
.qz-opt .qz-key { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); font-size: 13px; font-weight: 700; flex: 0 0 auto; background: var(--bg); color: var(--ink); }
.qz-opt[aria-pressed="true"] .qz-key { background: var(--sel); border-color: var(--sel); color: var(--bg); }
.qz-opt.qz-textonly .qz-render { display: none; }
.after { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.after .btn[aria-pressed="true"] { background: var(--sel-bg); border-color: var(--sel); color: var(--sel); }
.hint { font-size: 13px; color: var(--ink-2); margin-left: auto; }
kbd { font: 600 12px var(--font); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg); }
.note { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 720px; }
.note label { font-weight: 600; font-size: 14px; }
.note textarea { width: 100%; min-height: 56px; resize: vertical; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--bg); }

.overview h2 { font-size: 22px; font-weight: 800; margin: 28px 0 10px; }
.overview h2:first-child { margin-top: 0; }
.olist { display: grid; gap: 6px; }
.orow { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 220px); gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 10px 12px; cursor: pointer; }
.orow:hover { border-color: var(--ink-2); }
.orow .n { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 14px; }
.orow .a { color: var(--sel); font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orow .a.none { color: var(--ink-2); font-weight: 500; }
.done { text-align: center; padding: 60px 0; }
.done h2 { font-size: 30px; font-weight: 800; margin: 0 0 8px; }
.done p { color: var(--ink-2); margin: 0 auto 20px; max-width: 52ch; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-weight: 600; font-size: 14px; z-index: 60; }
textarea.copybox { width: 100%; min-height: 140px; border: 1px solid var(--line); border-radius: var(--r); padding: 10px; background: var(--surface); margin-top: 8px; }
@media (max-width: 640px) { .qz-top { position: static; } .qz-top-in { gap: 8px 12px; padding-block: 10px; } }
@media (max-width: 640px) { .orow { grid-template-columns: 32px minmax(0, 1fr); } .orow .a { grid-column: 2; } .hint { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>/*BASE_CSS*/</style>

<div class="qz-top">
  <div class="wrap qz-top-in">
    <span class="brand">Designquizet</span>
    <div class="parts" id="parts" role="group" aria-label="Del"></div>
    <div class="spacer"></div>
    <button type="button" class="btn" id="toggleView">Översikt</button>
    <button type="button" class="btn primary" id="copy">Kopiera svaren</button>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="wrap save" id="save">Ansluter till lagringen…</div>
</div>

<main class="wrap" id="main"></main>
