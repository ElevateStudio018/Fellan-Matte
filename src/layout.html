<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#1e6e37">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="sv_SE">
  <meta property="og:site_name" content="Axel&amp;Gren">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <link rel="canonical" href="https://www.axelgren.se/{{path}}">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Zilla+Slab:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Axel&Gren",
    "description": "Gårdsbutik med ekologisk glass, hembakat, inredning, mathantverk och självplock på Stabby gård i Uppsala-Näs.",
    "email": "axelochgren@gmail.com",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Stabby 186",
      "postalCode": "755 91",
      "addressLocality": "Uppsala",
      "addressCountry": "SE"
    },
    "geo": { "@type": "GeoCoordinates", "latitude": 59.79303, "longitude": 17.57773 },
    "sameAs": ["https://www.instagram.com/axelochgren/"]
  }
  </script>
  <script src="assets/js/main.js" defer></script>
</head>
<body{{bodyclass}}>
{{icons}}
<a class="skip-link" href="#innehall">Hoppa till innehållet</a>
{{header}}
<main id="innehall">
{{content}}
</main>
{{footer}}
</body>
</html>
